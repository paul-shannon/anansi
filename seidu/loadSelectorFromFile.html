<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Ananzi </title>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="phone-data.js"></script>

   <style>

body{
   margin: 100px;
   margin-top: 30px;
   font-family: "New York Times-Roman";
   font-size: 24px;
   color: red;
   height: 100%;
   }

#buyButton{
    font-size: 32px;
}

</style>

<script>

$(document).ready(function(){

  console.log("document ready")

  $.each(phones, function(i, item) {
     var text = item.name + ":  $" + item.cost;
     $('#phone-selector').append($('<option>', { 
        value: item.name,
        text : text
        }));
    });

  $("#phone-selector").on("change", function(event){
      console.log("phone change");
      var selection = this.value;
      $("#buyButton").prop("disabled", selection.length == 0)
      })

  $("#buyButton").on("click", function(){
     alert("Purchasing " + $("#phone-selector").val())
     })

  }); // document ready

</script>
</head>


<body>

<center>
  <h3 id="title">Demo: load a selector from data file</h3>
  <select name="phones" style="font-size: 18px;" id="phone-selector">
     <option value="" style="padding: 20px;">Select a Phone...</option>
  </select>

  <br>
  <button disabled id="buyButton" style="margin-top: 30px; font-size: 22px;"> Buy</button>

</center> 

</body>
</html>
